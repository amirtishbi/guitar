<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>שמיעה מוזיקלית — ניחוש מיתרים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Frank+Ruhl+Libre:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{--walnut:#17110b;--walnut2:#241a10;--amber:#e9b25a;--gold:#ffcf7a;--brass-bright:#f0d29a;
    --correct:#8fb46a;--correct-deep:#5f8347;--wrong:#c9694f;--ink:#f4e9d6;--ink-dim:#b39c7d;--line:#4a381f;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{font-family:'Assistant',system-ui,sans-serif;
    background:radial-gradient(120% 80% at 50% 6%,#3a2b18 0%,var(--walnut2) 42%,var(--walnut) 100%);
    color:var(--ink);min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:12px 12px 20px;overflow-x:hidden;}
  .wrap{width:100%;max-width:520px;display:flex;flex-direction:column;flex:1;}
  header{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:4px;}
  h1{font-family:'Frank Ruhl Libre',serif;font-weight:900;font-size:clamp(22px,6.5vw,32px);margin:0;line-height:1;}
  h1 span{color:var(--amber);}
  .sub{font-size:12.5px;color:var(--ink-dim);margin-top:3px;}
  .stats{display:flex;gap:7px;}
  .stat{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:11px;padding:5px 10px;text-align:center;min-width:52px;cursor:pointer;}
  .stat b{display:block;font-family:'Frank Ruhl Libre',serif;font-size:18px;font-weight:700;color:var(--gold);line-height:1;}
  .stat small{font-size:10px;color:var(--ink-dim);}

  .stage{position:relative;flex:1;max-height:390px;min-height:290px;margin-top:12px;direction:ltr;}
  .pegs{position:absolute;left:0;top:0;bottom:0;width:20px;background:linear-gradient(90deg,#4a3218,#2c1c0d);
    border:1px solid #1c1208;border-right:none;border-radius:8px 0 0 8px;box-shadow:inset 0 0 8px rgba(0,0,0,.5);}
  .peg{position:absolute;left:3px;width:14px;height:14px;border-radius:50%;transform:translateY(-50%);
    background:radial-gradient(circle at 35% 30%,#f0ead8,#8a8272 70%,#5a5347);border:1px solid #3a352c;box-shadow:0 1px 2px rgba(0,0,0,.5);}
  .sidelabels{position:absolute;left:20px;top:0;bottom:0;width:60px;}
  .lab{position:absolute;left:0;right:6px;display:flex;flex-direction:column;align-items:center;transform:translateY(-50%);}
  .lab .num{font-family:'Frank Ruhl Libre',serif;font-weight:700;font-size:15px;color:var(--ink);
    background:rgba(0,0,0,.35);border:1px solid var(--line);width:26px;height:26px;line-height:24px;border-radius:50%;text-align:center;transition:.2s;}
  .lab .note{font-size:10.5px;color:var(--ink-dim);margin-top:2px;}
  .lab .pips{display:flex;gap:3px;margin-top:3px;}
  .lab .pips i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.13);transition:.3s;}
  .lab .pips i.on{background:var(--gold);box-shadow:0 0 5px rgba(255,207,122,.6);}
  .lab.correct .num{background:var(--correct-deep);border-color:var(--correct);color:#fff;}
  .lab.wrong .num{background:#7d3a2b;border-color:var(--wrong);color:#fff;}
  .lab.focus .num{box-shadow:0 0 0 2px var(--amber),0 0 10px rgba(233,178,90,.45);}

  .neck{position:absolute;left:80px;right:0;top:0;bottom:0;overflow:hidden;border-radius:0 8px 8px 0;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.10) 0 2px,transparent 2px 11px),
      linear-gradient(180deg,#4a2f1a,#341f10 55%,#26160a);border:1px solid #140c05;box-shadow:inset 0 0 26px rgba(0,0,0,.55);}
  .nut{position:absolute;left:0;top:0;bottom:0;width:9px;background:linear-gradient(90deg,#f3ead2,#c8b78f);box-shadow:2px 0 4px rgba(0,0,0,.5);z-index:3;}
  .fret{position:absolute;top:0;bottom:0;width:3px;background:linear-gradient(90deg,#e7d6ac,#8f7c52);box-shadow:1px 0 2px rgba(0,0,0,.5);}
  .inlay{position:absolute;width:9px;height:9px;border-radius:50%;top:50%;transform:translate(-50%,-50%);background:radial-gradient(circle at 35% 30%,#fff,#c9bfa4 70%,#9a8f74);opacity:.7;}
  .fretnums{position:absolute;top:3px;left:0;right:0;height:13px;display:none;z-index:3;pointer-events:none;}
  .neck.frets-on .fretnums{display:block;}
  .fretnums span{position:absolute;transform:translateX(-50%);font-size:10px;color:rgba(244,233,214,.45);font-weight:600;}
  .fretline{position:absolute;top:0;bottom:0;width:3px;transform:translateX(-50%);border-radius:2px;z-index:1;
    background:linear-gradient(180deg,rgba(255,207,122,0),rgba(255,207,122,.95),rgba(255,207,122,0));
    box-shadow:0 0 10px rgba(233,178,90,.9);opacity:0;transition:opacity .12s;pointer-events:none;}
  .fretline.show{opacity:1;}
  .stringline{position:absolute;left:0;right:0;height:3px;transform:translateY(-50%);border-radius:2px;z-index:1;
    background:linear-gradient(90deg,rgba(255,207,122,0),rgba(255,207,122,.9) 12%,rgba(255,207,122,.9) 88%,rgba(255,207,122,0));
    box-shadow:0 0 9px rgba(233,178,90,.85);opacity:0;transition:opacity .12s;pointer-events:none;}
  .stringline.show{opacity:1;}
  .finger{position:absolute;width:17px;height:17px;border-radius:50%;transform:translate(-50%,-50%) scale(.5);
    background:radial-gradient(circle at 35% 30%,#fff,#e9b25a 75%,#a86e2a);box-shadow:0 0 9px rgba(233,178,90,.85);
    opacity:0;transition:opacity .12s,transform .12s;pointer-events:none;z-index:5;}
  .finger.show{opacity:1;transform:translate(-50%,-50%) scale(1);}

  .string{position:absolute;left:0;right:0;background:transparent;border:none;padding:0;cursor:pointer;transform:translateY(-50%);z-index:2;}
  .string:disabled{cursor:default;}
  .string svg{display:block;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 1.5px rgba(0,0,0,.65));}
  .string .wire{fill:none;stroke-linecap:round;}
  .string.focus svg{filter:drop-shadow(0 0 4px rgba(233,178,90,.7));}

  .feedback{text-align:center;min-height:24px;font-size:14.5px;font-weight:600;margin:14px 2px 2px;color:var(--ink-dim);}
  .feedback.ok{color:var(--gold);} .feedback.no{color:var(--wrong);}
  .controls{margin-top:10px;display:flex;gap:10px;}
  .btn{font-family:inherit;font-weight:700;font-size:16px;border-radius:14px;border:1px solid transparent;cursor:pointer;padding:14px 16px;flex:1;transition:transform .08s,filter .15s;color:var(--walnut);}
  .btn:active{transform:translateY(1px) scale(.99);}
  .btn.primary{background:linear-gradient(180deg,var(--gold),var(--amber));box-shadow:0 4px 14px rgba(233,178,90,.28);}
  .btn.ghost{flex:0 0 auto;background:transparent;border-color:var(--line);color:var(--ink);min-width:54px;font-size:20px;}
  .btn:disabled{opacity:.4;cursor:default;}

  .modes{display:flex;justify-content:center;margin-top:12px;}
  .switch{display:inline-flex;align-items:center;gap:9px;cursor:pointer;font-size:13.5px;color:var(--ink-dim);user-select:none;
    background:rgba(0,0,0,.2);border:1px solid var(--line);border-radius:20px;padding:7px 14px;}
  .switch input{display:none;}
  .track{width:38px;height:21px;border-radius:11px;background:rgba(255,255,255,.14);position:relative;transition:.2s;flex:0 0 auto;}
  .track::after{content:"";position:absolute;top:2px;right:2px;width:17px;height:17px;border-radius:50%;background:#d8cbb2;transition:.2s;}
  .switch input:checked + .track{background:var(--amber);}
  .switch input:checked + .track::after{right:19px;background:#3a2a13;}

  .learn{margin-top:12px;}
  .learn summary{list-style:none;cursor:pointer;color:var(--ink-dim);font-size:13px;text-align:center;padding:6px;}
  .learn summary::-webkit-details-marker{display:none;}
  .learn summary::before{content:"🔊  ";}
  .refrow{display:flex;gap:6px;margin-top:8px;direction:ltr;}
  .ref{flex:1;font-family:inherit;cursor:pointer;background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:8px 4px;font-size:12px;}
  .ref b{display:block;font-family:'Frank Ruhl Libre',serif;font-size:15px;color:var(--brass-bright);}

  .modal{position:fixed;inset:0;background:rgba(10,7,3,.78);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:18px;z-index:20;}
  .modal.show{display:flex;}
  .card{width:100%;max-width:420px;background:linear-gradient(160deg,#2c2013,#1c140b);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.5);}
  .card h2{font-family:'Frank Ruhl Libre',serif;margin:0 0 4px;font-size:24px;}
  .card .tot{font-size:13px;color:var(--ink-dim);margin-bottom:14px;}
  .row{display:flex;align-items:center;gap:10px;margin:9px 0;direction:rtl;}
  .row .tag{font-family:'Frank Ruhl Libre',serif;font-weight:700;width:26px;height:26px;line-height:24px;text-align:center;border-radius:50%;border:1px solid var(--line);background:rgba(0,0,0,.3);flex:0 0 auto;}
  .row .nm{width:34px;font-size:13px;color:var(--ink-dim);flex:0 0 auto;}
  .bar{flex:1;height:9px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden;}
  .bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--amber),var(--gold));}
  .row .pct{width:42px;text-align:left;font-size:12px;color:var(--ink-dim);flex:0 0 auto;}
  .cardbtns{display:flex;gap:10px;margin-top:18px;}
  footer{text-align:center;font-size:11px;color:var(--ink-dim);opacity:.6;margin-top:12px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>שמיעה <span>מוזיקלית</span></h1><div class="sub">נגן צליל — נחש איזה מיתר פתוח זה</div></div>
    <div class="stats">
      <div class="stat" id="openSummary"><b id="streak">0</b><small>רצף</small></div>
      <div class="stat" id="openSummary2"><b id="acc">—</b><small>דיוק</small></div>
    </div>
  </header>

  <div class="stage">
    <div class="pegs" id="pegs"></div>
    <div class="sidelabels" id="labels"></div>
    <div class="neck" id="neck">
      <div class="nut"></div>
      <div class="fretnums" id="fretnums"></div>
      <div class="fretline" id="fretline"></div>
      <div class="stringline" id="stringline"></div>
      <div class="strings" id="strings"></div>
    </div>
  </div>

  <div class="feedback" id="feedback">לחץ על «נגן צליל» כדי להתחיל</div>
  <div class="controls">
    <button class="btn primary" id="playBtn">🎸 נגן צליל</button>
    <button class="btn ghost" id="replayBtn" title="השמע שוב" disabled>↻</button>
  </div>

  <div class="modes">
    <label class="switch"><input type="checkbox" id="fretsToggle"><span class="track"></span>כלול לחיצות על סריגים</label>
  </div>

  <details class="learn">
    <summary>הכר את המיתרים — האזן לכל אחד</summary>
    <div class="refrow" id="refrow"></div>
  </details>
  <footer>כוונון סטנדרטי EADGBE · הצלילים מכוילים לגובה מדויק</footer>
</div>

<div class="modal" id="modal">
  <div class="card">
    <h2>סיכום שליטה</h2>
    <div class="tot" id="tot"></div>
    <div id="ranks"></div>
    <div class="cardbtns">
      <button class="btn primary" id="closeSummary">חזרה לתרגול</button>
      <button class="btn ghost" id="resetBtn" style="min-width:auto;flex:0 0 auto;padding:14px 18px;">אפס</button>
    </div>
  </div>
</div>

<script>
const STRINGS=[
  {num:6,note:'מי',letter:'E',freq:82.41, w:6.2,wound:true},
  {num:5,note:'לה',letter:'A',freq:110.00,w:5.2,wound:true},
  {num:4,note:'רה',letter:'D',freq:146.83,w:4.3,wound:true},
  {num:3,note:'סול',letter:'G',freq:196.00,w:3.4,wound:true},
  {num:2,note:'סי',letter:'B',freq:246.94,w:2.5,wound:false},
  {num:1,note:'מי',letter:'E',freq:329.63,w:1.8,wound:false},
];
STRINGS.forEach(s=>{s.level=0;s.missBias=0;s.seen=0;s.miss=0;});
const LEVEL_WEIGHT=[3.0,1.9,1.1,0.35];
function computeWeight(s){ s.weight=LEVEL_WEIGHT[s.level]+s.missBias; }
const MAXFRET=4;                 // open + frets 1..4
let fretsOn=false;

const KEY='earTrainingProgress_v1';
let rounds=0,firstCorrect=0,streak=0,bestStreak=0;
function save(){ try{ localStorage.setItem(KEY,JSON.stringify({s:STRINGS.map(s=>({l:s.level,mb:s.missBias,se:s.seen,mi:s.miss})),rounds,firstCorrect,bestStreak,f:fretsOn})); }catch(e){} }
function load(){ try{ const d=JSON.parse(localStorage.getItem(KEY)); if(!d)return;
  d.s.forEach((o,i)=>{ if(STRINGS[i]){STRINGS[i].level=o.l;STRINGS[i].missBias=o.mb;STRINGS[i].seen=o.se;STRINGS[i].miss=o.mi;}});
  rounds=d.rounds||0;firstCorrect=d.firstCorrect||0;bestStreak=d.bestStreak||0;fretsOn=!!d.f; }catch(e){} }
load(); STRINGS.forEach(computeWeight);

let audio=null;
function ctx(){ if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)(); if(audio.state==='suspended')audio.resume(); return audio; }
function pluck(freq,dur=2.6,wound=false){
  const ac=ctx(),sr=ac.sampleRate,decay=0.9968;
  const readDelay=sr/freq-0.5,N=Math.floor(readDelay),len=Math.floor(sr*dur);
  const buf=new Float32Array(N+4); let prev=0; const soft=wound?0.65:0.4;
  for(let i=0;i<N;i++){ const n=Math.random()*2-1; const s=(1-soft)*n+soft*prev; prev=n; buf[i]=s; }
  const out=ac.createBuffer(1,len,sr),d=out.getChannelData(0); let wp=N,lossPrev=0;
  for(let i=0;i<len;i++){ const rp=wp-readDelay; let i0=Math.floor(rp); const f=rp-i0;
    const a=buf[((i0)%buf.length+buf.length)%buf.length],b=buf[((i0+1)%buf.length+buf.length)%buf.length];
    const s=a+f*(b-a); d[i]=s; const lp=0.5*(s+lossPrev); lossPrev=s; buf[wp%buf.length]=lp*decay; wp++; }
  const fade=Math.floor(sr*0.14); for(let i=0;i<fade;i++) d[len-1-i]*=i/fade;
  const src=ac.createBufferSource(); src.buffer=out;
  const hp=ac.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=55;
  const lpf=ac.createBiquadFilter(); lpf.type='lowpass'; lpf.frequency.value=wound?3200:4200;
  const body=ac.createBiquadFilter(); body.type='peaking'; body.frequency.value=180; body.gain.value=3; body.Q.value=.7;
  const g=ac.createGain(); g.gain.value=0.92;
  src.connect(hp); hp.connect(body); body.connect(lpf); lpf.connect(g); g.connect(ac.destination); src.start();
}
function noteFreq(i,fret){ return STRINGS[i].freq*Math.pow(2,fret/12); }

const strings=document.getElementById('strings'),labels=document.getElementById('labels'),
  pegs=document.getElementById('pegs'),neck=document.getElementById('neck'),refrow=document.getElementById('refrow'),
  fretnums=document.getElementById('fretnums');
const els=[];
const ROWH=100/6;
function rowFromTop(i){ return STRINGS.length-1-i; }
function centerPct(i){ return (rowFromTop(i)+0.5)*ROWH; }
function zoneCenterPct(fret){ return (fret+0.5)/(MAXFRET+1)*100; }

// fret wires (MAXFRET wires -> MAXFRET+1 zones) + inlay + fret numbers
for(let z=1;z<=MAXFRET;z++){ const fr=document.createElement('div'); fr.className='fret'; fr.style.left=(z/(MAXFRET+1)*100)+'%'; neck.appendChild(fr); }
const inlay=document.createElement('div'); inlay.className='inlay'; inlay.style.left=zoneCenterPct(3)+'%'; neck.appendChild(inlay);
for(let n=0;n<=MAXFRET;n++){ const sp=document.createElement('span'); sp.textContent=n; sp.style.left=zoneCenterPct(n)+'%'; fretnums.appendChild(sp); }

STRINGS.forEach((s,i)=>{
  const cp=centerPct(i);
  const peg=document.createElement('div'); peg.className='peg'; peg.style.top=cp+'%'; pegs.appendChild(peg);
  const btn=document.createElement('button'); btn.className='string'; btn.setAttribute('aria-label',`מיתר ${s.num} ${s.note}`);
  btn.style.top=cp+'%'; btn.style.height=ROWH+'%';
  const grad=`sg${i}`,hi=s.wound?'#e9c98f':'#f2f2ee',mid=s.wound?'#b98a3f':'#c9c9c4',lo=s.wound?'#6b4a1f':'#7d7d78';
  btn.innerHTML=`<svg viewBox="0 0 400 40" preserveAspectRatio="none"><defs>
    <linearGradient id="${grad}" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="${hi}"/><stop offset=".5" stop-color="${mid}"/><stop offset="1" stop-color="${lo}"/></linearGradient></defs>
    <path class="wire" d="M0 20 Q200 20 400 20" stroke="url(#${grad})" stroke-width="${s.w}"/></svg>`;
  btn.addEventListener('click',(ev)=>onStringTap(i,ev));
  strings.appendChild(btn);
  const lab=document.createElement('div'); lab.className='lab'; lab.style.top=cp+'%';
  lab.innerHTML=`<span class="num">${s.num}</span><span class="note">${s.note}</span><span class="pips"><i></i><i></i><i></i></span>`;
  labels.appendChild(lab);
  els.push({btn,lab,path:btn.querySelector('.wire'),pips:lab.querySelectorAll('.pips i')});
  const ref=document.createElement('button'); ref.className='ref'; ref.innerHTML=`<b>${s.num}</b>${s.note}`;
  ref.addEventListener('click',()=>{ pluck(s.freq,2.6,s.wound); vibrate(i); }); refrow.appendChild(ref);
});

function vibrate(i,scale=1){
  const p=els[i].path,amp=(7+STRINGS[i].w*1.4)*scale,t0=performance.now(),dur=900;
  (function frame(t){ const e=(t-t0)/dur;
    if(e>=1){ p.setAttribute('d','M0 20 Q200 20 400 20'); return; }
    const off=amp*Math.sin(e*Math.PI*2*7)*Math.exp(-e*4.2);
    p.setAttribute('d',`M0 20 Q200 ${20+off} 400 20`); requestAnimationFrame(frame);
  })(t0);
}
function fretFromX(btn,clientX){ const r=btn.getBoundingClientRect(); let f=(clientX-r.left)/r.width; f=Math.max(0,Math.min(0.999,f)); return Math.floor(f*(MAXFRET+1)); }
function showFinger(i,fret){ if(fret<=0) return; const dot=document.createElement('div'); dot.className='finger';
  dot.style.top=centerPct(i)+'%'; dot.style.left=zoneCenterPct(fret)+'%'; neck.appendChild(dot);
  requestAnimationFrame(()=>dot.classList.add('show'));
  setTimeout(()=>{ dot.classList.remove('show'); setTimeout(()=>dot.remove(),300); },750); }
const fretline=document.getElementById('fretline'); let fretlineTimer=null;
function showFretLine(fret){ fretline.style.left=zoneCenterPct(fret)+'%'; fretline.classList.add('show');
  clearTimeout(fretlineTimer); fretlineTimer=setTimeout(()=>fretline.classList.remove('show'),800); }
const stringline=document.getElementById('stringline');
function showStringLine(i){ stringline.style.top=centerPct(i)+'%'; stringline.classList.add('show'); }

let answerStr=null,answerFret=0,firstTry=true,phase='idle',lastAnswer=-1,repeatCount=0;
const fb=document.getElementById('feedback'),playBtn=document.getElementById('playBtn'),
  replayBtn=document.getElementById('replayBtn'),streakEl=document.getElementById('streak'),accEl=document.getElementById('acc');
function setFeedback(t,c=''){ fb.textContent=t; fb.className='feedback '+c; }
function clearMarks(){ els.forEach(e=>e.lab.classList.remove('correct','wrong')); }
function refreshFocus(){ const maxW=Math.max(...STRINGS.map(s=>s.weight));
  STRINGS.forEach((s,i)=>{ els[i].pips.forEach((p,k)=>p.classList.toggle('on',k<s.level));
    const foc=s.weight>1.15 && s.weight>=maxW*0.85 && s.level<3;
    els[i].btn.classList.toggle('focus',foc); els[i].lab.classList.toggle('focus',foc); }); }
function pickAdaptive(){ const total=STRINGS.reduce((a,s)=>a+s.weight,0); let r=Math.random()*total,pick=0;
  for(let i=0;i<STRINGS.length;i++){ r-=STRINGS[i].weight; if(r<=0){pick=i;break;} }
  if(pick===lastAnswer && repeatCount>=2){ const alt=STRINGS.map((s,i)=>i).filter(i=>i!==pick);
    let t2=alt.reduce((a,i)=>a+STRINGS[i].weight,0),r2=Math.random()*t2;
    for(const i of alt){ r2-=STRINGS[i].weight; if(r2<=0){pick=i;break;} } }
  repeatCount=(pick===lastAnswer)?repeatCount+1:0; lastAnswer=pick; return pick; }

function newNote(){ clearMarks(); answerStr=pickAdaptive();
  answerFret=fretsOn?Math.floor(Math.random()*(MAXFRET+1)):0; firstTry=true; phase='guessing';
  els.forEach(e=>e.btn.disabled=false); replayBtn.disabled=false; playBtn.textContent='🎸 נגן צליל';
  setFeedback(fretsOn?'מנגן... איזה מיתר ואיזה סריג?':'מנגן... איזה מיתר זה?');
  pluck(noteFreq(answerStr,answerFret),2.6,STRINGS[answerStr].wound); }

function onStringTap(i,ev){
  const fret=fretsOn?fretFromX(els[i].btn,ev.clientX):0;
  pluck(noteFreq(i,fret),2.6,STRINGS[i].wound); vibrate(i); showFinger(i,fret); showStringLine(i);
  if(fretsOn) showFretLine(fret);
  if(phase==='guessing') registerGuess(i,fret);
}
function registerGuess(i,fret){
  const a=STRINGS[answerStr]; const rightStr=(i===answerStr), rightFret=(fret===answerFret);
  if(rightStr&&rightFret){
    els[i].lab.classList.add('correct'); els.forEach(e=>e.btn.disabled=true);
    rounds++; a.seen++; let mastered=false;
    if(firstTry){ firstCorrect++; streak++; if(streak>bestStreak)bestStreak=streak;
      a.level=Math.min(3,a.level+1); a.missBias*=0.5; if(a.level===3)mastered=true; } else streak=0;
    computeWeight(a); updateStats(); refreshFocus(); save();
    const pos=answerFret?`סריג ${answerFret}`:'פתוח';
    setFeedback(mastered?`שלטת במיתר ${a.num} · ${a.note}! יופיע פחות עכשיו`:`יפה! מיתר ${a.num} · ${a.note} · ${pos}`,'ok');
    phase='solved'; playBtn.textContent='הצליל הבא ←';
  } else {
    if(firstTry){ firstTry=false; a.miss++; a.level=0; a.missBias=Math.min(3,a.missBias+0.9); computeWeight(a); refreshFocus(); save(); }
    streak=0; updateStats();
    els[i].lab.classList.add('wrong'); setTimeout(()=>els[i].lab.classList.remove('wrong'),650);
    let hint;
    if(rightStr){ hint = fret<answerFret ? 'מיתר נכון! הסריג גבוה יותר (ימינה)' : 'מיתר נכון! הסריג נמוך יותר (שמאלה)'; }
    else { hint = noteFreq(i,fret)<noteFreq(answerStr,answerFret) ? 'הצליל שלך נמוך מדי' : 'הצליל שלך גבוה מדי'; }
    setFeedback('לא זה. '+hint,'no');
  }
}
function updateStats(){ streakEl.textContent=streak; accEl.textContent=rounds?Math.round(firstCorrect/rounds*100)+'%':'—'; }

const modal=document.getElementById('modal'),ranks=document.getElementById('ranks'),tot=document.getElementById('tot');
function showSummary(){
  const order=STRINGS.slice().sort((x,y)=>(y.level-x.level)||((y.seen?(y.seen-y.miss)/y.seen:0)-(x.seen?(x.seen-x.miss)/x.seen:0)));
  ranks.innerHTML=order.map(s=>{ const acc=s.seen?Math.round((s.seen-s.miss)/s.seen*100):null; const strength=Math.round(s.level/3*100);
    return `<div class="row"><span class="tag">${s.num}</span><span class="nm">${s.note}</span><span class="bar"><i style="width:${strength}%"></i></span><span class="pct">${acc===null?'—':acc+'%'}</span></div>`; }).join('');
  tot.textContent=`סה״כ ${rounds} צלילים · דיוק ${rounds?Math.round(firstCorrect/rounds*100):0}% · רצף שיא ${bestStreak}`;
  modal.classList.add('show');
}
document.getElementById('openSummary').onclick=showSummary;
document.getElementById('openSummary2').onclick=showSummary;
document.getElementById('closeSummary').onclick=()=>modal.classList.remove('show');
document.getElementById('resetBtn').onclick=()=>{ if(!confirm('לאפס את כל ההתקדמות?'))return;
  STRINGS.forEach(s=>{s.level=0;s.missBias=0;s.seen=0;s.miss=0;computeWeight(s);});
  rounds=0;firstCorrect=0;streak=0;bestStreak=0; try{localStorage.removeItem(KEY);}catch(e){}
  updateStats(); refreshFocus(); modal.classList.remove('show'); setFeedback('התקדמות אופסה. בהצלחה!',''); };

const fretsToggle=document.getElementById('fretsToggle');
function applyFretsUI(){ neck.classList.toggle('frets-on',fretsOn);
  document.querySelector('.sub').textContent = fretsOn?'נגן צליל — נחש את המיתר והסריג':'נגן צליל — נחש איזה מיתר פתוח זה'; }
fretsToggle.checked=fretsOn; applyFretsUI();
fretsToggle.addEventListener('change',()=>{ fretsOn=fretsToggle.checked; applyFretsUI(); save();
  if(phase!=='guessing') setFeedback(fretsOn?'מצב סריגים פעיל — לחץ «נגן צליל»':'מצב מיתרים פתוחים — לחץ «נגן צליל»'); });

playBtn.addEventListener('click',()=>{ ctx(); if(phase==='guessing')return; newNote(); });
replayBtn.addEventListener('click',()=>{ if(answerStr!=null) pluck(noteFreq(answerStr,answerFret),2.6,STRINGS[answerStr].wound); });
updateStats(); refreshFocus();
</script>
</body>
